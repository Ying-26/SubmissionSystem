
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯投稿</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans TC", sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #356ac3;
            box-shadow: 0 0 0 3px rgba(53, 106, 195, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 22px;
            font-size: 14px;
            cursor: pointer;
            background: #356ac3;
            color: white;
        }

        button:hover {
            background: #28549d;
        }

        .footer {
            margin-top: 25px;
        }

        .footer a {
            color: #356ac3;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 25px auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>編輯投稿</h1>
        <p class="subtitle">修改稿件資訊與文章內容。</p>
    </div>

    <div class="card">

        <form action="/author/update" method="post">

            <input type="hidden" name="id" value="{{ article.id }}">

            <div class="form-group">
                <label for="category">稿件類別</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ article.category }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="title">稿件標題</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ article.title }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="content">文章內容</label>
                <textarea
                    id="content"
                    name="content"
                    required
                >{{ article.content }}</textarea>
            </div>

            <div class="actions">
                <button type="submit">儲存修改</button>
            </div>

        </form>

    </div>

    <div class="footer">
        <a href="/author">← 返回投稿清單</a>
    </div>

</div>

</body>
</html>
